<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Neet - باقات النت والدقائق</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
</head>
<body class="theme-default">
    <div class="ticker-wrap">
        <div class="ticker" id="topTicker">
            <div class="ticker__item">🔥 الأكثر طلباً: فودافون 5200 فليكس بـ 90 ج فقط!</div>
            <div class="ticker__item">⚡ تجديد أوتوماتيكي سريع وسهل عبر الواتساب</div>
            <div class="ticker__item">🔥 باقة 2600 فليكس بـ 50 ج | باقة 10400 بـ 180 ج</div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1 class="logo-text">Free <span>Neet</span></h1>
            <p class="subtitle">اختر شبكتك وباقتك وواصل اشتراكك بسهولة</p>
            <a href="admin.html" class="admin-link-top">لوحة التحكم 🔑</a>
        </header>

        <main class="card">
            <form id="orderForm">
                <div class="form-group">
                    <label>اختر الشبكة:</label>
                    <div class="network-selector">
                        <label class="net-btn vodafone" onclick="setNetworkTheme('vodafone')">
                            <input type="radio" name="network" value="فودافون" required>
                            <span>فودافون</span>
                        </label>
                        <label class="net-btn etisalat" onclick="setNetworkTheme('etisalat')">
                            <input type="radio" name="network" value="اتصالات" required>
                            <span>اتصالات</span>
                        </label>
                        <label class="net-btn we" onclick="setNetworkTheme('we')">
                            <input type="radio" name="network" value="WE" required>
                            <span>WE</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="package">اختر الباقة:</label>
                    <select id="package" required>
                        <option value="" disabled selected>-- اختر الشبكة أولاً --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone">رقم الهاتف:</label>
                    <input type="tel" id="phone" placeholder="01XXXXXXXXX" pattern="01[0125][0-9]{8}" required>
                </div>

                <div class="form-group hidden" id="passwordGroup">
                    <label for="vfPassword">كلمة مرور أنا فودافون:</label>
                    <input type="password" id="vfPassword" placeholder="أدخل كلمة المرور">
                    <div class="know-pass-check">
                        <label>
                            <input type="checkbox" id="dontKnowPass" onchange="togglePassInput(this)"> 
                            مش فاكر / ماعرفش الباسورد
                        </label>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <span>طلب الباقة عبر الواتساب 🚀</span>
                </button>
            </form>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
